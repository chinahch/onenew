name: Verify onenew customization
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opencode-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real OpenCode 2.3.2 server and actual command tool
        run: python3 customizations/onenew/ai-operations/tests/opencode-contract.py
      - name: Verify OpenCode 1.x compatibility against real server
        env:
          ONENEW_OPENCODE_TEST_VERSION: '1.19.6'
        run: python3 customizations/onenew/ai-operations/tests/opencode-contract.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The upstream entrypoint assigns private bind-mounted data to its www UID.
    # Keep private modes and exercise backup/restore with host root access.
    defaults:
      run:
        shell: sudo --preserve-env=COMPOSE_PROJECT_NAME,ONENEW_REVISION bash --noprofile --norc -e -o pipefail {0}
    env:
      COMPOSE_PROJECT_NAME: onenew-ci
      ONENEW_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only authenticated source archive download
        shell: bash
        env:
          ONENEW_SOURCE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"' EXIT
          printf '%s\n' "$ONENEW_SOURCE_TOKEN" > "$stage/github.token"
          unset ONENEW_SOURCE_TOKEN
          chmod 600 "$stage/github.token"
          source customizations/onenew/migration/source-download.sh
          onenew_download_source "$GITHUB_SHA" "$stage/source.tar.gz" "$stage" "$stage/github.token"
          tar -tzf "$stage/source.tar.gz" > "$stage/archive-list"
          grep -q '/Dockerfile$' "$stage/archive-list"
      - name: Prepare isolated deployment
        run: |
          cp compose.onenew.sample.yaml compose.yaml
          umask 077
          touch .env
          mkdir -p data/database data/redis storage/logs storage/theme plugins
          docker compose config --quiet
      - name: Build pinned image and both frontend checks
        run: docker compose build
      - name: Run PHP feature regressions with isolated SQLite and cache
        run: |
          python3 customizations/onenew/health/tests/test_short_command.py
          python3 customizations/onenew/migration/tests/source-download.py
          bash customizations/onenew/migration/tests/restore.sh
          bash customizations/onenew/migration/tests/version-pin.sh
          bash customizations/onenew/migration/tests/upgrade-restored.sh
          python3 customizations/onenew/migration/tests/bootstrap_success.py
          python3 customizations/onenew/runtime/tests/startup-update.py
          php customizations/onenew/runtime/tests/provider-boot.php
          php customizations/onenew/runtime-logs/tests/schema-guard.php
          docker run --rm --entrypoint sh onenew:local -c '
            set -eu
            cd /www
            composer install --no-interaction
            php /opt/onenew/migration/tests/core.php
            php /opt/onenew/energy/tests/amount.php
            php /opt/onenew/domains/tests/domains.php
            php /opt/onenew/cloud-backup/tests/schedule.php
            php /opt/onenew/geoip/tests/regions.php
            php /opt/onenew/web-restore/tests/core.php
            php /opt/onenew/ai-operations/tests/operator-engine-core.php
            php /opt/onenew/ai-operations/tests/opencode-core.php
            php /opt/onenew/ai-operations/tests/opencode-v2-core.php
            php /opt/onenew/ai-operations/tests/opencode-config-core.php
            php /opt/onenew/runtime-logs/tests/filter.php
            APP_ENV=testing APP_KEY=base64:aGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGg= DB_CONNECTION=sqlite DB_DATABASE=:memory: CACHE_DRIVER=array QUEUE_CONNECTION=sync SESSION_DRIVER=array vendor/bin/phpunit --bootstrap /opt/onenew/testing/ci-bootstrap.php /opt/onenew/health/tests /opt/onenew/user-portal/tests /opt/onenew/traffic/tests /opt/onenew/plugins/tests /opt/onenew/protocols/tests /opt/onenew/exit-probe/tests /opt/onenew/remote-upgrade/tests /opt/onenew/external/tests /opt/onenew/egress/tests /opt/onenew/migration/tests /opt/onenew/energy/tests /opt/onenew/bandwidth/tests /opt/onenew/landing-library/tests /opt/onenew/domains/tests /opt/onenew/cloud-backup/tests /opt/onenew/web-restore/tests /opt/onenew/ai-operations/tests /opt/onenew/runtime-logs/tests
          '
      - name: Initialize isolated database
        run: |
          docker compose run --rm -T -e ADMIN_ACCOUNT=ci-bootstrap@example.test onenew php artisan onenew:install --no-interaction > /tmp/onenew-install.log
          if ! grep -q '^INSTALLED=true\|^INSTALLED=1' .env; then
            sed '/管理员密码/d; /APP_KEY=/d; /password[=:]/Id; /token[=:]/Id' /tmp/onenew-install.log | tail -n 100
            exit 1
          fi
          docker compose up -d --wait
          docker compose exec -T -e ONENEW_CI_FIXTURE=isolated-only onenew php /opt/onenew/ci-smoke.php
      - name: Exercise actual login and user portal
        run: |
          curl --fail --silent http://127.0.0.1:7001/ | grep -q onenew
          AUTH=$(curl --fail --silent -H 'Content-Type: application/json' -d '{"email":"ci-onenew@example.test","password":"ci-onenew-disposable-2048"}' http://127.0.0.1:7001/api/v1/passport/auth/login | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["auth_data"])')
          echo "::add-mask::$AUTH"
          curl --fail --silent -H "Authorization: $AUTH" http://127.0.0.1:7001/api/onenew/user/me | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["user"]["email"]=="ci-onenew@example.test" and d["user"]["is_admin"]'
          curl --fail --silent -H "Authorization: $AUTH" http://127.0.0.1:7001/api/onenew/user/subscription | python3 -c 'import json,sys; assert json.load(sys.stdin)["path"]'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:7001/api/onenew/user/me)" = 403
          test "$(curl --silent -o /dev/null -w '%{http_code}' 'http://127.0.0.1:7001/api/v3/server/probes?machine_id=1')" = 403
          docker compose top onenew > /tmp/onenew-processes
          if grep -Ei 'xboard' /tmp/onenew-processes; then exit 1; fi
      - name: Verify pending migration on installed database before Redis starts
        run: |
          BEFORE=$(docker compose exec -T -e ONENEW_CI_FIXTURE=isolated-only onenew php /opt/onenew/runtime/tests/startup-schema.php prepare)
          docker compose stop onenew
          docker compose up -d --force-recreate --wait onenew
          AFTER=$(docker compose exec -T -e ONENEW_CI_FIXTURE=isolated-only onenew php /opt/onenew/runtime/tests/startup-schema.php check)
          test "$BEFORE" = "$AFTER"
          docker compose logs --no-color onenew > /tmp/onenew-startup-schema.log
          python3 -c 'from pathlib import Path; s=Path("/tmp/onenew-startup-schema.log").read_text(); fallback=s.index("redis not yet up, using array/sync drivers"); migrations=[s.index(name,fallback) for name in ["2026_11_18_000001_create_onenew_ai_config","2026_11_18_000020_create_onenew_runtime_logs"]]; services=s.index("[entrypoint] Starting services",fallback); assert all(fallback < migration < services for migration in migrations); assert "WARNING: onenew:update failed" not in s'
      - name: Export encrypted migration and restore into a fresh instance
        run: ONENEW_MIGRATION_CI=isolated-only bash customizations/onenew/migration/tests/ci-smoke.sh
      - name: Exercise browser upload validation and live restore
        run: ONENEW_WEB_RESTORE_CI=isolated-only python3 customizations/onenew/web-restore/tests/ci-smoke.py
      - name: Snapshot and restore isolated instance
        run: |
          sh customizations/onenew/backup.sh /tmp/onenew-ci-backup.tar.gz
          test -s /tmp/onenew-ci-backup.tar.gz
          docker compose down
          mkdir /tmp/onenew-ci-restored
          tar -xzf /tmp/onenew-ci-backup.tar.gz -C /tmp/onenew-ci-restored
          cd /tmp/onenew-ci-restored
          export COMPOSE_PROJECT_NAME=onenew-restore-ci
          docker compose up -d --wait
          curl --fail --silent -H 'Content-Type: application/json' -d '{"email":"ci-onenew@example.test","password":"ci-onenew-disposable-2048"}' http://127.0.0.1:7001/api/v1/passport/auth/login | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["auth_data"]'
          docker compose down
      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --tail=100 onenew
      - name: Clean isolated containers
        if: always()
        run: |
          docker compose down --remove-orphans
          if [ -d /tmp/onenew-ci-restored ]; then
            cd /tmp/onenew-ci-restored
            COMPOSE_PROJECT_NAME=onenew-restore-ci docker compose down --remove-orphans
          fi
