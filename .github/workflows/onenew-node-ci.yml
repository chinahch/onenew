name: Verify onenew native domain metadata
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: onenew
      - uses: actions/checkout@v4
        with:
          repository: chinahch/caddy
          ref: 1d1565f03960760902379e4e7e25daa3c236684f
          path: caddy
      - uses: actions/checkout@v4
        with:
          repository: cedar2025/Xboard-Node
          ref: 0a29338e1f102a462363ce3527417029f89bab28
          path: upstream
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: upstream/go.sum
      - name: Prepare fixed caddy source with domain metadata
        run: |
          python3 caddy/scripts/prepare_source.py --upstream upstream --out prepared
          python3 onenew/customizations/onenew/node-audit/patch.py prepared
          python3 onenew/customizations/onenew/node/hot_apply.py --source prepared
          python3 onenew/customizations/onenew/node/exit-probe-patch.py --source prepared
          python3 onenew/customizations/onenew/node/egress-patch.py --source prepared
          python3 onenew/customizations/onenew/node/bandwidth-patch.py --source prepared
          python3 onenew/customizations/onenew/node/argo-patch.py --source prepared
      - name: Verify panel health scheduling
        run: |
          grep -Fq 'public const INTERVAL = 60;' onenew/customizations/onenew/health/app/Onenew/ProbeService.php
          php -l onenew/customizations/onenew/health/app/Onenew/ProbeService.php
          php -l onenew/customizations/onenew/health/tests/ProbeHealthTest.php
      - name: Verify probe target matches the panel
        run: |
          grep -Fq 'const Target = "http://cp.cloudflare.com/generate_204"' prepared/internal/probe/probe.go
          grep -Fq "public const TARGET = 'http://cp.cloudflare.com/generate_204';" onenew/customizations/onenew/health/app/Onenew/ProbeOutboundBuilder.php
      - name: Verify package and installer regressions
        run: |
          python3 onenew/customizations/onenew/node/test_argo_patch.py
          python3 onenew/customizations/onenew/node/test_build.py
          python3 onenew/customizations/onenew/node/test_installer.py
          python3 onenew/customizations/onenew/node/test_exit_probe_patch.py
          python3 onenew/customizations/onenew/node/test_egress_patch.py
          python3 onenew/customizations/onenew/node/test_upgrade.py
          # Reject CRLF before packaging: Bash treated trailing CR as a command
          # and "set -Eeuo pipefail" as an invalid option on Linux.
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('onenew/customizations/onenew/node/install.sh'),
                    Path('onenew/customizations/onenew/runtime/app/Onenew/NodeInstallCommand.php')]:
              assert b'\r' not in p.read_bytes(), f'CRLF not allowed: {p}'
          PY
          bash -n onenew/customizations/onenew/node/install.sh
      - name: Test collectors and both native kernels
        working-directory: prepared
        run: go test -tags 'with_quic,with_utls,with_acme,with_clash_api,with_wireguard' ./...
      - name: Build Onenew native package
        run: python3 onenew/customizations/onenew/node/build.py --source prepared --arch ${{ matrix.arch }} --out dist
      - name: Verify amd64 executable version and CLI configuration
        if: matrix.arch == 'amd64'
        run: |
          dist/amd64/caddy -v | grep '^caddy onenew-v0.1.7 '
          grep -aFq 'http://cp.cloudflare.com/generate_204' dist/amd64/caddy
          mkdir -m 700 /tmp/onenew-fixture
          dist/amd64/caddyctl config init --mode machine --panel-url https://panel.example.test --token fixture-disposable-token --machine-id 7 --kernel singbox --health-port 65530 --version onenew-v0.1.7 --output /tmp/onenew-fixture/config.yml --credentials-out /tmp/onenew-fixture/credentials.env --meta /tmp/onenew-fixture/install-meta.json --install-root /etc/caddy
          test -s /tmp/onenew-fixture/config.yml
          test -s /tmp/onenew-fixture/credentials.env
      - uses: actions/upload-artifact@v4
        with:
          name: onenew-native-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-*
            dist/build-info-*.json
  publish:
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: onenew-native-*
          merge-multiple: true
          path: dist
      - name: Publish immutable versioned native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Do not replace a previously published package or move its source tag.
          if gh release view node-v0.1.7 >/dev/null 2>&1; then
            echo 'node-v0.1.7 already published; keeping the existing release unchanged.'
            exit 0
          fi
          gh release create node-v0.1.7 dist/*.tar.gz dist/SHA256SUMS-* dist/build-info-*.json --target "$GITHUB_SHA" --title 'Onenew native node v0.1.7' --prerelease --notes 'Native binary packages with tested systemd and OpenRC in-place upgrades and temporary rollback cleanup; the panel health interval is 60 seconds after panel deployment. Restores Argo and reverse-proxy plaintext WS origins with TLS subscriptions and certificate mode none. Self-probes use the fixed http://cp.cloudflare.com/generate_204 target shared with the panel and preserve actual local listener security. Configured certificate failures remain blocked; REALITY and remote exit probes remain unchanged. Includes previous node bandwidth and hot-apply fixes. SHA256 files included. amd64 smoke tested; arm64 cross-built, low-memory ARM64 runtime not validated. Existing caddy/php-fpm installations are preserved by the installer and need an explicit migration.'
