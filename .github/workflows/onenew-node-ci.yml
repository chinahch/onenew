name: Verify onenew native domain metadata
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: onenew
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Restore immutable prepared native source and apply staged health
        run: |
          curl --fail --location --retry 3 https://github.com/chinahch/onenew-releases/releases/download/node-v0.1.10/onenew-node-source.tar.gz -o baseline.tar.gz
          echo 'd2e702be1f2a642b6338fb1386935a794452be8d30da2b2363a72d41bd956290  baseline.tar.gz' | sha256sum -c -
          mkdir prepared
          tar -xzf baseline.tar.gz -C prepared
          python3 onenew/customizations/onenew/node/staged-health-patch.py --source prepared
          gofmt -w prepared/internal/probe/probe.go prepared/internal/probe/stages.go prepared/internal/probe/stages_test.go
      - name: Verify panel health scheduling
        run: |
          grep -Fq 'public const INTERVAL = 60;' onenew/customizations/onenew/health/app/Onenew/ProbeService.php
          php -l onenew/customizations/onenew/health/app/Onenew/ProbeService.php
          php -l onenew/customizations/onenew/health/tests/ProbeHealthTest.php
      - name: Verify probe target matches the panel
        run: |
          grep -Fq 'const Target = "https://www.cloudflare.com/cdn-cgi/trace"' prepared/internal/probe/probe.go
          grep -Fq "public const TARGET = 'https://www.cloudflare.com/cdn-cgi/trace';" onenew/customizations/onenew/health/app/Onenew/ProbeOutboundBuilder.php
      - name: Verify package and installer regressions
        run: |
          python3 onenew/customizations/onenew/node/test_argo_patch.py
          python3 onenew/customizations/onenew/node/test_build.py
          python3 onenew/customizations/onenew/node/test_installer.py
          python3 onenew/customizations/onenew/node/test_token_validation.py
          python3 onenew/customizations/onenew/node/test_service_health.py
          python3 onenew/customizations/onenew/node/test_exit_probe_patch.py
          python3 onenew/customizations/onenew/node/test_egress_patch.py
          python3 onenew/customizations/onenew/node/test_upgrade.py
          python3 onenew/customizations/onenew/node/test_publish_distribution.py
          # Reject CRLF before packaging: Bash treated trailing CR as a command
          # and "set -Eeuo pipefail" as an invalid option on Linux.
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('onenew/customizations/onenew/node/install.sh'),
                    Path('onenew/customizations/onenew/runtime/app/Onenew/NodeInstallCommand.php')]:
              assert b'\r' not in p.read_bytes(), f'CRLF not allowed: {p}'
          PY
          bash -n onenew/customizations/onenew/node/install.sh
          php -l onenew/customizations/onenew/runtime/app/Onenew/NodeInstallCommand.php
      - name: Verify installer token gate on Alpine musl
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -v "$PWD/onenew:/src:ro" alpine:3.22 sh -ec 'apk add --no-cache bash python3 >/dev/null; python3 /src/customizations/onenew/node/test_token_validation.py; python3 /src/customizations/onenew/node/test_service_health.py'
      - name: Test collectors and both native kernels
        working-directory: prepared
        run: go test -tags 'with_quic,with_utls,with_acme,with_clash_api,with_wireguard' ./...
      - name: Build Onenew native package
        run: python3 onenew/customizations/onenew/node/build.py --source prepared --arch ${{ matrix.arch }} --out dist
      - name: Verify amd64 executable version and CLI configuration
        if: matrix.arch == 'amd64'
        run: |
          dist/amd64/caddy -v | grep '^caddy onenew-v0.1.11 '
          grep -aFq 'https://www.cloudflare.com/cdn-cgi/trace' dist/amd64/caddy
          mkdir -m 700 /tmp/onenew-fixture
          dist/amd64/caddyctl config init --mode machine --panel-url https://panel.example.test --token fixture-disposable-token --machine-id 7 --kernel singbox --health-port 65530 --version onenew-v0.1.11 --output /tmp/onenew-fixture/config.yml --credentials-out /tmp/onenew-fixture/credentials.env --meta /tmp/onenew-fixture/install-meta.json --install-root /etc/caddy
          test -s /tmp/onenew-fixture/config.yml
          test -s /tmp/onenew-fixture/credentials.env
      - name: Package corresponding native source and build instructions
        if: matrix.arch == 'amd64'
        run: |
          cp onenew/customizations/onenew/node/BUILDING.md prepared/ONENEW-BUILDING.md
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --exclude=.git -czf dist/onenew-node-source.tar.gz -C prepared .
          (cd dist && sha256sum onenew-node-source.tar.gz > SHA256SUMS-source)
      - uses: actions/upload-artifact@v4
        with:
          name: onenew-native-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-*
            dist/build-info-*.json
  publish:
    needs: native
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: onenew
      - uses: actions/download-artifact@v4
        with:
          pattern: onenew-native-*
          merge-multiple: true
          path: dist
      - name: Publish immutable versioned native packages
        env:
          GH_TOKEN: ${{ secrets.ONENEW_RELEASE_TOKEN }}
          GH_REPO: chinahch/onenew-releases
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo 'Set ONENEW_RELEASE_TOKEN with Contents write access to chinahch/onenew-releases'; exit 1; }
          if gh release view node-v0.1.11 >/dev/null 2>&1; then
            # Never replace binary assets. Source publication is additive only.
            assets=$(gh release view node-v0.1.11 --json assets --jq '.assets[].name')
            for file in onenew-node-source.tar.gz SHA256SUMS-source; do
              if ! printf '%s\n' "$assets" | grep -Fxq "$file"; then gh release upload node-v0.1.11 "dist/$file"; fi
            done
            mkdir verify-source
            gh release download node-v0.1.11 --dir verify-source --pattern onenew-node-source.tar.gz --pattern SHA256SUMS-source
            (cd verify-source && sha256sum -c SHA256SUMS-source)
          else
            gh release create node-v0.1.11 dist/*.tar.gz dist/SHA256SUMS-* dist/build-info-*.json --target main --title 'Onenew native node v0.1.11' --prerelease --notes 'Native binary packages and corresponding source, with SHA256 checksums. Service and process name remain caddy. Panel source is not included.'
          fi
          python3 onenew/customizations/onenew/node/publish_distribution.py --root onenew
