name: Verify onenew native domain metadata
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: onenew
      - uses: actions/checkout@v4
        with:
          repository: chinahch/caddy
          ref: 11f025992aa163204c5d4d2d8fb0934a0ab2e893
          path: caddy
      - uses: actions/checkout@v4
        with:
          repository: cedar2025/Xboard-Node
          ref: 0a29338e1f102a462363ce3527417029f89bab28
          path: upstream
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: upstream/go.sum
      - name: Prepare fixed caddy source with domain metadata
        run: |
          python3 caddy/scripts/prepare_source.py --upstream upstream --out prepared
          python3 onenew/customizations/onenew/node-audit/patch.py prepared
      - name: Verify package and installer regressions
        run: |
          python3 onenew/customizations/onenew/node/test_build.py
          python3 onenew/customizations/onenew/node/test_installer.py
          bash -n onenew/customizations/onenew/node/install.sh
      - name: Test collectors and both native kernels
        working-directory: prepared
        run: go test -tags 'with_quic,with_utls,with_acme,with_clash_api,with_wireguard' ./internal/onenewaudit ./internal/kernel/xray ./internal/kernel/singbox ./internal/machine
      - name: Build Onenew native package
        run: python3 onenew/customizations/onenew/node/build.py --source prepared --arch ${{ matrix.arch }} --out dist
      - name: Verify amd64 executable version and CLI configuration
        if: matrix.arch == 'amd64'
        run: |
          dist/amd64/caddy -v | grep '^caddy onenew-v0.1.0 '
          mkdir -m 700 /tmp/onenew-fixture
          dist/amd64/caddyctl config init --mode machine --panel-url https://panel.example.test --token fixture-disposable-token --machine-id 7 --kernel singbox --health-port 65530 --version onenew-v0.1.0 --output /tmp/onenew-fixture/config.yml --credentials-out /tmp/onenew-fixture/credentials.env --meta /tmp/onenew-fixture/install-meta.json --install-root /etc/caddy
          test -s /tmp/onenew-fixture/config.yml
          test -s /tmp/onenew-fixture/credentials.env
      - uses: actions/upload-artifact@v4
        with:
          name: onenew-native-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-*
            dist/build-info-*.json
  publish:
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: onenew-native-*
          merge-multiple: true
          path: dist
      - name: Publish immutable versioned native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Do not replace a previously published package or move its source tag.
          if gh release view node-v0.1.0 >/dev/null 2>&1; then
            echo 'node-v0.1.0 already published; keeping the existing release unchanged.'
            exit 0
          fi
          gh release create node-v0.1.0 dist/*.tar.gz dist/SHA256SUMS-* dist/build-info-*.json --target "$GITHUB_SHA" --title 'Onenew native node v0.1.0' --prerelease --notes 'Native binary packages for systemd/OpenRC. Fixed dual-kernel, dual-IP, certificate, real proxy probe and opt-in domain metadata overlays. SHA256 files included. amd64 smoke tested; arm64 cross-built, low-memory ARM64 runtime not validated. Existing caddy/php-fpm installations are preserved by the installer and need an explicit migration.'
